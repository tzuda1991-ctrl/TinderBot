name: Build Tinder Auto Messenger APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete Android Project & Code
        run: |
          # 1. प्रोजेक्ट के सारे फोल्डर्स अपने आप बनाएं
          mkdir -p app/src/main/java/com/tinder/autobot
          mkdir -p app/src/main/res/xml

          # 2. settings.gradle बनाएं
          cat << 'EOF' > settings.gradle
          rootProject.name = "TinderAutoBot"
          include ':app'
          EOF

          # 3. Root build.gradle बनाएं
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.1.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 4. gradle.properties बनाएं
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 5. App build.gradle बनाएं
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tinder.autobot'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tinder.autobot"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {}
          EOF

          # 6. AndroidManifest.xml बनाएं
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application
                  android:label="Tinder Auto Bot"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TinderBotService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 7. Accessibility Config बनाएं
          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          # 8. पूरा Kotlin Code (MainActivity + Floating Button + Auto Bot) एक ही फाइल में बनाएं
          cat << 'EOF' > app/src/main/java/com/tinder/autobot/MainActivity.kt
          package com.tinder.autobot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.random.Random

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 80, 50, 50)
                  }

                  val title = TextView(this).apply {
                      text = "🔥 Tinder 5000+ Matches Auto-Messenger\n\nस्टेप 1: नीचे अपने मैसेज सेट करें (कॉमा ',' लगाकर कई मैसेज लिखें)।\nस्टेप 2: Accessibility परमिशन ऑन करें।\nस्टेप 3: स्क्रीन पर लाल/हरा Floating बटन आ जाएगा। Tinder खोलें और START दबाएं!"
                      textSize = 15f
                  }

                  val msgInput = EditText(this).apply {
                      setText("Hi 👋, Hello! How are you?, Hey there 😊, Hi! Nice to match with you")
                  }

                  val saveBtn = Button(this).apply {
                      text = "1. Save Custom Messages"
                      setOnClickListener {
                          val prefs = getSharedPreferences("bot_prefs", MODE_PRIVATE)
                          prefs.edit().putString("messages", msgInput.text.toString()).apply()
                          Toast.makeText(this@MainActivity, "Messages Saved!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val accessBtn = Button(this).apply {
                      text = "2. Enable Accessibility Service (यहाँ से ऑन करें)"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }

                  layout.addView(title)
                  layout.addView(msgInput)
                  layout.addView(saveBtn)
                  layout.addView(accessBtn)
                  setContentView(layout)
              }
          }

          class TinderBotService : AccessibilityService() {
              private val handler = Handler(Looper.getMainLooper())
              private var isRunning = false
              private var windowManager: WindowManager? = null
              private var floatBtn: Button? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  showFloatingButton()
              }

              private fun showFloatingButton() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatBtn = Button(this).apply {
                      text = "▶ START BOT"
                      setBackgroundColor(Color.parseColor("#FF4458"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          isRunning = !isRunning
                          if (isRunning) {
                              text = "⏹ STOP BOT"
                              setBackgroundColor(Color.parseColor("#2ECC71"))
                              runBotStep()
                          } else {
                              text = "▶ START BOT"
                              setBackgroundColor(Color.parseColor("#FF4458"))
                              handler.removeCallbacksAndMessages(null)
                          }
                      }
                  }

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = 30
                      y = 250
                  }

                  windowManager?.addView(floatBtn, params)
              }

              private fun getRandomMessage(): String {
                  val prefs = getSharedPreferences("bot_prefs", MODE_PRIVATE)
                  val raw = prefs.getString("messages", "Hi 👋, Hello!, Hey there 😊") ?: "Hi"
                  val list = raw.split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  return if (list.isNotEmpty()) list.random() else "Hi 👋"
              }

              private fun runBotStep() {
                  if (!isRunning) return
                  val root = rootInActiveWindow
                  if (root == null) {
                      scheduleNext(2000)
                      return
                  }

                  // 1. चेक करें कि क्या हम चैट स्क्रीन के अंदर हैं (Message बॉक्स ढूँढें)
                  val editNode = findEditText(root)
                  if (editNode != null) {
                      val msg = getRandomMessage()
                      val args = Bundle()
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, msg)
                      editNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                      editNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)

                      // 1.5 सेकंड बाद Send पर क्लिक करें
                      handler.postDelayed({
                          if (!isRunning) return@postDelayed
                          val currentRoot = rootInActiveWindow
                          val sendNode = currentRoot?.let { findNodeByText(it, "Send") ?: findNodeByText(it, "SEND") }
                          sendNode?.performAction(AccessibilityNodeInfo.ACTION_CLICK)

                          // भेजने के 2 सेकंड बाद वापस चैट लिस्ट में आएं और थोड़ा स्क्रोल करें
                          handler.postDelayed({
                              if (!isRunning) return@postDelayed
                              performGlobalAction(GLOBAL_ACTION_BACK)
                              handler.postDelayed({
                                  scrollDownSmall()
                                  scheduleNext(Random.nextLong(2500, 4500))
                              }, 1500)
                          }, 2000)
                      }, 1500)
                      return
                  }

                  // 2. अगर हम चैट लिस्ट में हैं -> "Your turn" या किसी प्रोफाइल पर क्लिक करें
                  val yourTurnNode = findNodeByText(root, "Your turn")
                  if (yourTurnNode != null) {
                      clickClickableParent(yourTurnNode)
                      scheduleNext(2500)
                  } else {
                      // अगर सामने कोई प्रोफाइल पर क्लिक करना हो (स्क्रीन के बीच में टैप + स्क्रोल)
                      tapOnProfileAndScroll()
                      scheduleNext(3000)
                  }
              }

              private fun clickClickableParent(node: AccessibilityNodeInfo?) {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) {
                          current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          return
                      }
                      current = current.parent
                  }
                  // अगर क्लिक न हो तो टैप जेस्चर का इस्तेमाल करें
                  tapScreen(500f, 700f)
              }

              private fun tapOnProfileAndScroll() {
                  tapScreen(450f, 850f)
              }

              private fun scheduleNext(delay: Long) {
                  if (!isRunning) return
                  handler.postDelayed({ runBotStep() }, delay)
              }

              private fun findEditText(node: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  if (node.className?.toString()?.contains("EditText") == true) return node
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      val res = findEditText(child)
                      if (res != null) return res
                  }
                  return null
              }

              private fun findNodeByText(node: AccessibilityNodeInfo, text: String): AccessibilityNodeInfo? {
                  val list = node.findAccessibilityNodeInfosByText(text)
                  return if (list.isNotEmpty()) list[0] else null
              }

              private fun tapScreen(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 100))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              private fun scrollDownSmall() {
                  val path = Path().apply {
                      moveTo(500f, 1400f)
                      lineTo(500f, 950f)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 400))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() { isRunning = false }
          }
          EOF

      - name: Install Gradle & Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Assemble Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinder-Auto-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
